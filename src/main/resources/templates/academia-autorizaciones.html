<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autorizaciones · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido"><p class="eyebrow">GESTIÓN ACADÉMICA</p><h1>Autorizar entrega tardía</h1><p><a class="text-link" th:href="@{/academia/misiones}">← Misiones</a></p><p th:if="${param.guardado}">Autorización registrada.</p><p role="alert" th:if="${error}" th:text="${error}"></p><form class="panel demo-search" method="post" th:action="@{/academia/autorizaciones}"><label for="asignacion">Misión y destinatario</label><select id="asignacion" name="asignacion" required><option value="">Selecciona</option><option th:each="o : ${opciones}" th:value="${o.id + ':' + o.stage}" th:text="${o.title + ' · ' + o.recipient + ' · ' + o.stageTitle}"></option></select><label for="fecha">Válida hasta (fin del día en Colombia)</label><input id="fecha" type="date" name="fecha" required><label for="motivo">Motivo</label><textarea id="motivo" name="motivo" maxlength="2000" required></textarea><button class="button button-primary">Autorizar</button></form><section class="panel"><h2>Autorizaciones vigentes</h2><p th:if="${param.revocada}">Autorización revocada; se conserva el historial.</p><p th:if="${#lists.isEmpty(autorizaciones)}">No hay autorizaciones vigentes.</p><article th:each="a : ${autorizaciones}"><h3 th:text="${a.mission + ' · ' + a.stage}"></h3><p th:text="${a.recipient + ' · válida hasta ' + a.until}"></p><p th:text="${a.reason}"></p><form method="post" th:action="@{/academia/autorizaciones/revocar}"><input type="hidden" name="autorizacion" th:value="${a.id}"><button class="button" type="submit">Revocar autorización</button></form></article></section></main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
