<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conversación · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}"><script th:if="${pagina.number == 0}" defer th:src="@{/js/chat.js}"></script>  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido"><p class="eyebrow">COMUNICACIÓN</p><h1 th:text="${sala.name}"></h1><p><a class="text-link" th:href="@{/chat}">← Chat</a></p><p th:if="${pagina.number == 0}">Se muestran los 100 mensajes más recientes.</p><p th:if="${pagina.number > 0}">Historial anterior; vuelve a los mensajes recientes para enviar.</p><nav aria-label="Páginas de mensajes"><a th:if="${pagina.number > 0}" th:href="@{/chat/{id}(id=${sala.id},pagina=${pagina.number - 1})}">← Más recientes</a><span th:if="${pagina.number > 0 and pagina.more}"> · </span><a th:if="${pagina.more}" th:href="@{/chat/{id}(id=${sala.id},pagina=${pagina.number + 1})}">Más antiguos →</a></nav><section class="panel" id="chat" th:attr="data-socket=@{/chat/socket/{id}(id=${sala.id})}"><p th:if="${pagina.number == 0}" id="chat-status" role="status">Conectando…</p><ol id="chat-messages" aria-live="polite"><li th:each="m : ${pagina.items}"><strong th:text="${m.author}"></strong><span> · </span><time th:text="${m.sent}"></time><p th:text="${m.content}"></p></li></ol><form th:if="${pagina.number == 0}" id="chat-form"><label for="chat-text">Mensaje</label><textarea id="chat-text" maxlength="2000" required></textarea><button class="button button-primary" type="submit">Enviar</button></form></section></main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
