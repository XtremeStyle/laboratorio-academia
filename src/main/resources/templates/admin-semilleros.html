<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración de semilleros · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">
  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido">
<p class="eyebrow">ADMINISTRACIÓN</p><h1>Semilleros</h1>
<p><a class="text-link" th:href="@{/}">← Volver al panel</a> · <a class="text-link" th:href="@{/administracion/usuarios}">Usuarios</a> · <a class="text-link" th:href="@{/administracion/asignaciones}">Asignaciones</a></p>
<p th:if="${param.creado}">Semillero creado.</p><p th:if="${error}" th:text="${error}" role="alert"></p>
<form class="panel demo-search" method="post" th:action="@{/administracion/semilleros}">
<label for="codigo">Código</label><input id="codigo" name="codigo" required maxlength="50" pattern="[A-Za-z0-9_-]{2,50}">
<label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="160">
<label for="descripcion">Descripción</label><input id="descripcion" name="descripcion" maxlength="2000">
<button class="button button-primary" type="submit">Crear semillero</button>
</form>
<div class="demo-results"><article class="panel" th:each="semillero : ${semilleros}"><p class="eyebrow" th:text="${semillero.codigo}"></p><h2 th:text="${semillero.nombre}"></h2><p th:text="${semillero.descripcion}"></p></article></div>
<p th:if="${#lists.isEmpty(semilleros)}">No hay semilleros activos.</p>
<form method="post" th:action="@{/logout}"><button class="button" type="submit">Cerrar sesión</button></form>
</main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
