<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notificaciones · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido"><p class="eyebrow">MI ACTIVIDAD</p><h1>Notificaciones</h1><p><a class="text-link" th:href="@{/mis-misiones}">← Mis Misiones</a></p><p th:if="${#lists.isEmpty(notificaciones)}">No tienes notificaciones.</p><article class="panel" th:each="n : ${notificaciones}"><p th:text="${n.content}"></p><small th:text="${n.created}"></small><span th:if="${n.read != null}"> · Leída</span><form th:if="${n.read == null}" method="post" th:action="@{/notificaciones/leida}"><input type="hidden" name="id" th:value="${n.id}"><button class="button" type="submit">Marcar como leída</button></form></article></main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
