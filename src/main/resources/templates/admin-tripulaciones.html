<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tripulaciones · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido">
<p class="eyebrow">ADMINISTRACIÓN</p><h1>Tripulaciones</h1><p><a class="text-link" th:href="@{/}">← Inicio</a> · <a class="text-link" th:href="@{/administracion/asignaciones}">Asignaciones</a></p>
<p th:if="${param.guardado}">Cambios guardados.</p><p th:if="${error}" role="alert" th:text="${error}"></p>
<form class="panel demo-search" th:action="@{/administracion/tripulaciones}" method="post"><h2>Crear Tripulación</h2><label for="track">Semillero</label><select id="track" name="semillero" required><option value="">Selecciona</option><option th:each="s : ${vista.tracks}" th:value="${s.id}" th:text="${s.name}"></option></select><label for="name">Nombre</label><input id="name" name="nombre" required maxlength="160"><button class="button button-primary">Crear</button></form>
<form class="panel demo-search" th:action="@{/administracion/tripulaciones/miembros}" method="post"><h2>Agregar integrante</h2><label for="crew">Tripulación</label><select id="crew" name="tripulacion" required><option value="">Selecciona</option><option th:each="c : ${vista.crews}" th:value="${c.id}" th:text="${c.name + ' · ' + c.track}"></option></select><label for="member">Usuario</label><select id="member" name="usuario" required><option value="">Selecciona</option><option th:each="u : ${vista.users}" th:value="${u.id}" th:text="${u.name}"></option></select><label for="function">Función</label><select id="function" name="funcion"><option value="PARTICIPANTE">Participante</option><option value="RESPONSABLE">Responsable</option></select><button class="button button-primary">Agregar</button></form>
<section class="panel"><h2>Tripulaciones activas</h2><p th:if="${#lists.isEmpty(vista.crews)}">No hay Tripulaciones.</p><ul><li th:each="c : ${vista.crews}" th:text="${c.name + ' · ' + c.track}"></li></ul></section>
<section class="panel"><h2>Integrantes activos</h2><div th:each="m : ${vista.members}" class="assignment-row"><span th:text="${m.email + ' · ' + m.crew + ' · ' + m.function}"></span><form method="post" th:action="@{/administracion/tripulaciones/miembros/cerrar}"><input type="hidden" name="membresia" th:value="${m.id}"><button type="submit">Cerrar membresía</button></form></div></section>
</main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
