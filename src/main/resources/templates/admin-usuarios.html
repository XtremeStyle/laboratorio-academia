<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">
  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido">
<p class="eyebrow">ADMINISTRACIÓN</p><h1>Usuarios</h1><p><a class="text-link" th:href="@{/administracion/auditoria}">Auditoría académica</a> · <a class="text-link" th:href="@{/administracion/clasificacion}">Clasificación global</a></p>
<p><a class="text-link" th:href="@{/}">← Volver al panel</a> · <a class="text-link" th:href="@{/administracion/semilleros}">Semilleros</a> · <a class="text-link" th:href="@{/administracion/asignaciones}">Asignaciones</a></p>
<p th:if="${param.creado}">Usuario creado.</p><p th:if="${param.actualizado}">Nombre actualizado.</p><p th:if="${error}" th:text="${error}" role="alert"></p>
<form class="panel demo-search" method="post" th:action="@{/administracion/usuarios}">
<label for="correo">Correo</label><input id="correo" name="correo" type="email" required maxlength="254" autocomplete="off">
<label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="120">
<label for="apellido">Apellido</label><input id="apellido" name="apellido" required maxlength="120">
<label for="contrasena">Contraseña inicial (mínimo 12 caracteres)</label><input id="contrasena" name="contrasena" type="password" required minlength="12" autocomplete="new-password">
<fieldset><legend>Roles</legend><label><input type="checkbox" name="roles" value="ESTUDIANTE"> Estudiante</label> <label><input type="checkbox" name="roles" value="PROFESOR"> Profesor</label> <label><input type="checkbox" name="roles" value="ADMINISTRADOR"> Administrador</label></fieldset>
<button class="button button-primary" type="submit">Crear usuario</button>
</form>
<section class="panel"><h2>Usuarios de la academia</h2><p th:if="${#lists.isEmpty(usuarios)}">No hay usuarios.</p>
<article th:each="u : ${usuarios}"><p><span th:text="${u.correo}"></span> · <span th:text="${u.estado}"></span></p><form class="demo-search" method="post" th:action="@{/administracion/usuarios/nombre}"><input type="hidden" name="usuario" th:value="${u.id}"><label>Nombre<input name="nombre" required maxlength="120" th:value="${u.nombre}"></label><label>Apellido<input name="apellido" required maxlength="120" th:value="${u.apellido}"></label><button class="button" type="submit">Guardar nombre</button></form><form method="post" th:action="@{/administracion/usuarios/roles}"><input type="hidden" name="usuario" th:value="${u.id}"><fieldset><legend>Roles</legend><label><input type="checkbox" name="roles" value="ESTUDIANTE" th:checked="${u.roles.contains('ESTUDIANTE')}"> Estudiante</label> <label><input type="checkbox" name="roles" value="PROFESOR" th:checked="${u.roles.contains('PROFESOR')}"> Profesor</label> <label><input type="checkbox" name="roles" value="ADMINISTRADOR" th:checked="${u.roles.contains('ADMINISTRADOR')}"> Administrador</label></fieldset><button class="button" type="submit">Guardar roles</button></form><form method="post" th:if="${u.estado == 'ACTIVO' or u.estado == 'INACTIVO'}" th:action="@{/administracion/usuarios/estado}"><input type="hidden" name="usuario" th:value="${u.id}"><input type="hidden" name="estado" th:value="${u.estado == 'ACTIVO' ? 'INACTIVO' : 'ACTIVO'}"><button class="button" type="submit" th:text="${u.estado == 'ACTIVO' ? 'Desactivar cuenta' : 'Activar cuenta'}"></button></form></article></section>
<form method="post" th:action="@{/logout}"><button class="button" type="submit">Cerrar sesión</button></form>
</main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
