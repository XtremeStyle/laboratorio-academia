<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auditoría · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Auditoría académica</h1><p><a class="text-link" th:href="@{/}">← Inicio</a></p><p>Últimos 200 eventos registrados de esta academia. No incluye el contenido de entregas ni contraseñas.</p><p th:if="${#lists.isEmpty(eventos)}">No hay eventos registrados.</p><div class="panel" th:unless="${#lists.isEmpty(eventos)}"><table><thead><tr><th scope="col">Fecha</th><th scope="col">Responsable</th><th scope="col">Acción</th><th scope="col">Recurso</th></tr></thead><tbody><tr th:each="e : ${eventos}"><td th:text="${e.time}"></td><td th:text="${e.actor}"></td><td th:text="${e.action}"></td><td th:text="${e.resource + ' · ' + e.resourceId}"></td></tr></tbody></table></div></main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
