<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi perfil · CHANGE</title><link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head><body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main class="content-wrap" id="contenido"><p class="eyebrow">MI CUENTA</p><h1>Mi perfil</h1><p><a class="text-link" th:href="@{/}">← Inicio</a></p><p th:if="${param.guardado}">Perfil actualizado.</p><p role="alert" th:if="${error}" th:text="${error}"></p><section class="panel"><p>Correo: <strong th:text="${perfil.email}"></strong></p><p>Roles: <span th:text="${#strings.listJoin(perfil.roles, ', ')}"></span></p><form class="demo-search" method="post" th:action="@{/mi-perfil}"><label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="120" required th:value="${perfil.name}"><label for="apellido">Apellido</label><input id="apellido" name="apellido" maxlength="120" required th:value="${perfil.surname}"><button class="button button-primary">Guardar perfil</button></form></section><form class="panel demo-search" method="post" th:action="@{/mi-perfil/contrasena}"><h2>Cambiar contraseña</h2><p>Al cambiarla se cerrará esta sesión y las demás dejarán de ser válidas al volver a utilizarlas.</p><label for="actual">Contraseña actual</label><input id="actual" name="actual" type="password" autocomplete="current-password" required><label for="nueva">Nueva contraseña (mínimo 12 caracteres)</label><input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="12" required><label for="confirmacion">Confirmar nueva contraseña</label><input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" minlength="12" required><button class="button button-primary">Cambiar contraseña</button></form></main>  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body></html>
