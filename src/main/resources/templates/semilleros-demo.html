<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semilleros · CHANGE</title>
    <link rel="stylesheet" th:href="@{/css/laboratorio.css}"><link rel="stylesheet" th:href="@{/css/change-brand.css}">
  <link rel="stylesheet" th:href="@{/css/space-lab.css}">
</head>
<body><a class="skip-link" href="#contenido">Saltar al contenido principal</a>
<main class="content-wrap" id="contenido">
    <p class="eyebrow">LABORATORIO · DEMOSTRACIÓN</p>
    <h1>Consulta de <span>semilleros</span></h1>
    <p class="welcome-subtitle">Estos registros de demostración se consultan en la base de datos local.</p>
    <p><a class="text-link" th:href="@{/}">← Volver al panel</a></p>
    <form class="panel demo-search" method="get" th:action="@{/demostracion/semilleros}">
        <label for="q">Buscar por nombre o código</label>
        <div class="demo-search-row"><input id="q" name="q" type="search" maxlength="100" th:value="${q}" placeholder="Ej. Robótica">
        <button class="button button-primary" type="submit">Buscar</button></div>
    </form>
    <p th:if="${error}" role="alert" th:text="${error}"></p>
    <p th:if="${error == null and #lists.isEmpty(semilleros)}">No hay semilleros que coincidan con la búsqueda.</p>
    <div class="demo-results">
        <article class="panel" th:each="semillero : ${semilleros}">
            <p class="eyebrow" th:text="${semillero.codigo}">CÓDIGO</p>
            <h2 th:text="${semillero.nombre}">Semillero</h2>
            <p class="welcome-subtitle" th:text="${semillero.descripcion}"></p>
        </article>
    </div>
</main>
  <div id="os-terminal" class="os-terminal" role="status" aria-label="Barra de estado CHANGE"><span class="os-dot"></span><span class="os-label">CHANGE·OS</span><span class="os-log"><b>NAV //</b> sesión autenticada</span><span class="os-right">SECURE · LOCAL</span></div>
  <script th:src="@{/js/os-terminal.js}" defer></script>
</body>
</html>
